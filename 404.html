<body>
<header class="top">
  <button id="btnBack" class="icbtn back" type="button" aria-label="Назад" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
  <img class="logo" src="assets/sotuvdesc-mark.svg" alt="Sotuvdesc" width="36" height="36">
  <div class="brand"><b>Sotuvdesc</b><small>CRM · SavdEx</small></div>
  <button id="btnSearchAll" class="icbtn" type="button" data-act="searchAll" aria-label="Поиск везде"><svg class="ic" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 4.2 12.6l4.1 4.1 1.4-1.4-4.1-4.1A7 7 0 0 0 11 4zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg></button>
  <button id="syncBtn" class="sync off" type="button"><i></i><span></span></button>
  <button id="userBtn" class="icbtn" type="button" aria-label="Профиль"><svg class="ic" viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg><span id="userName" class="uname"></span></button>
  <div id="langSw" class="langsw"><button data-lang="ru">RU</button><button data-lang="uz">UZ</button><button data-lang="uzc" title="Ўзбекча (кирилл)">ЎЗ</button><button data-lang="en">EN</button></div>
</header>
<div id="netbar" class="netbar" role="status" aria-live="polite" hidden></div>

<main>
  <section id="v-list" class="view">
    <div class="searchbar">
      <input id="q" type="search" data-tp="search_ph" autocomplete="off">
      <button id="btnFilter" class="btn ghost" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M3 5h18v2l-7 7v5l-4 2v-7L3 7z"/></svg><span data-t="filter"></span><i id="fbadge" class="dot" hidden></i></button>
    </div>
    <div id="segChips" class="chips" hidden></div>
    <div class="listhead">
      <span id="count" class="count"></span>
      <select id="sort" aria-label="sort"></select>
      <button id="btnView" class="btn small ghost" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><span data-t="view_board"></span></button>
      <button id="btnAdd" class="btn small primary" type="button" aria-label="+"><svg class="ic" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      <button id="btnSelect" class="btn small ghost" type="button"></button>
    </div>
    <div id="selbar" class="selbar" hidden></div>
    <div id="empty" class="empty" hidden></div>
    <p id="nores" class="muted pad" data-t="nothing_found" hidden></p>
    <div id="listwrap" class="listwrap">
      <div id="scroller" class="scroller"><div id="spacer" class="spacer"><div id="rows"></div></div></div>
      <div id="board" class="board" hidden></div>
    </div>
  </section>
  <section id="v-deals" class="view" hidden></section>
  <section id="v-today" class="view" hidden></section>
  <section id="v-tasks" class="view" hidden></section>
  <section id="v-chat" class="view" hidden></section>
  <section id="v-stats" class="view" hidden></section>
  <section id="v-more" class="view" hidden></section>
</main>

<nav class="tabs">
  <button data-tab="list" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h2v2H4zm4 0h12v2H8zM4 11h2v2H4zm4 0h12v2H8zm-4 5h2v2H4zm4 0h12v2H8z"/></svg><span data-t="tab_list"></span></button>
  <button data-tab="deals"><svg class="ic" viewBox="0 0 24 24"><path d="M3 4h5v16H3zm6.5 0h5v10h-5zM16 4h5v13h-5z"/></svg><span data-t="tab_deals"></span></button>
  <button data-tab="today"><svg class="ic" viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3c.6 0 1 .4 1 1v15c0 .6-.4 1-1 1H4c-.6 0-1-.4-1-1V5c0-.6.4-1 1-1h3zM5 9v10h14V9zm2 2h4v4H7z"/></svg><span data-t="tab_today"></span><b id="todayBadge" class="badge" hidden></b></button>
  <button data-tab="tasks" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M19 3h-4.2A3 3 0 0 0 9.2 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-2 14-4-4 1.4-1.4L10 14.2l6.6-6.6L18 9z"/></svg><span data-t="tab_tasks"></span><b id="ttBadge" class="badge" hidden></b></button>
  <button data-tab="chat"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16c.6 0 1 .4 1 1v11c0 .6-.4 1-1 1H8l-4 4V5c0-.6.4-1 1-1zm1 2v10.2L7.2 15H19V6zm2 2h10v2H7zm0 3h7v2H7z"/></svg><span data-t="tab_chat"></span><b id="chatBadge" class="badge" hidden></b></button>
  <button data-tab="stats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19h16v2H4zM5 10h3v7H5zm5.5-5h3v12h-3zM16 13h3v4h-3z"/></svg><span data-t="tab_stats"></span></button>
  <button data-tab="more"><svg class="ic" viewBox="0 0 24 24"><path d="M5 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg><span data-t="tab_more"></span></button>
</nav>

<button id="fab" class="fab" type="button" aria-label="+" data-act="quickAdd"><svg class="ic" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
<div id="layer"></div>
<div id="busy" class="busy" hidden><div class="busybox"><p id="busyMsg"></p><div class="pbar"><i id="busyBar"></i></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="gate" class="gate" hidden></div>
<div id="boot" class="boot"><img src="assets/sotuvdesc-logo-stacked.svg" alt="Sotuvdesc" width="200" height="150"></div>
<input type="file" id="fileIn" accept=".csv,.tsv,.txt,.json,.xlsx,.xls,.xlsm,.ods,text/csv,text/plain,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
